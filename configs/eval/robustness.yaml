# 10 fixed Stage-1 tasks x 4 axes x 5 episodes.
eval_seed: 12345
n_episodes: 5
init_offset: 0
axes: [camera, lighting, background, noise]
tasks:
  - {suite: libero_spatial, task_id: 0}
  - {suite: libero_spatial, task_id: 3}
  - {suite: libero_spatial, task_id: 6}
  - {suite: libero_object, task_id: 0}
  - {suite: libero_object, task_id: 3}
  - {suite: libero_object, task_id: 6}
  - {suite: libero_object, task_id: 9}
  - {suite: libero_goal, task_id: 0}
  - {suite: libero_goal, task_id: 3}
  - {suite: libero_goal, task_id: 6}
params:
  camera_pos_m: 0.03
  camera_rot_deg: 5.0
  light_scale_low: 0.4
  light_scale_high: 1.6
  light_pos_m: 0.5
  background_tint_low: 0.5
  background_tint_high: 1.3
  noise_std: 0.03
